[build-system]
requires = ["setuptools>=80.0"]
build-backend = "setuptools.build_meta"

[project]
name = "didban-mali-api"
version = "0.1.0"
description = "API modular monolith for Didban Mali"
requires-python = ">=3.12,<3.14"
dependencies = [
  "alembic==1.20.0",
  "argon2-cffi==25.1.0",
  "asyncpg==0.31.0",
  "boto3==1.43.93",
  "celery==5.6.3",
  "duckdb==1.5.5",
  "fastapi==0.141.1",
  "email-validator==2.3.0",
  "jdatetime==6.1.0",
  "openpyxl==3.1.5",
  "polars==1.44.2",
  "psycopg[binary]==3.3.5",
  "pydantic-settings==2.15.0",
  "PyJWT==2.14.0",
  "python-multipart==0.0.32",
  "arabic-reshaper==3.0.0",
  "python-bidi==0.6.7",
  "reportlab==4.4.9",
  "redis==8.1.0",
  "sqlalchemy[asyncio]==2.0.52",
  "uuid6==2025.0.1",
  "uvicorn[standard]==0.52.4"
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "mypy==2.3.1",
  "pypdf==6.10.0",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "ruff==0.16.7"
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["integration: requires the local Docker stack"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["arabic_reshaper", "bidi", "bidi.*", "boto3", "boto3.*", "botocore", "botocore.*", "celery", "celery.*", "jdatetime", "jdatetime.*", "openpyxl", "openpyxl.*", "reportlab", "reportlab.*"]
ignore_missing_imports = true
