<div id="didban-luminous" lang="fa" dir="rtl" class="relative isolate overflow-hidden rounded-3xl bg-[var(--db-canvas)] font-db text-sm leading-7 text-[var(--db-ink)] antialiased selection:bg-[var(--db-soft)]">

<script>
(() => {
  const root = document.getElementById('didban-luminous');
  const q = (s) => root.querySelector(s);
  const esc = (v) => String(v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const icon = (name, cls='size-4') => `<i data-lucide="${name}" class="${cls}" aria-hidden="true"></i>`;
  const buttonBase = 'cursor-interaction inline-flex min-h-11 items-center justify-center gap-2 rounded-xl px-4 py-2 text-sm font-medium transition-[background-color,box-shadow,transform] duration-200 focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-[var(--db-brand)] disabled:opacity-50 disabled:cursor-not-allowed motion-reduce:transition-none';
  // Standalone preview primitives. They are newly authored, not imported product components.
  const UI = {
    Button(text, action, kind='secondary', extra='', attrs='') {
      const variants = { primary:'bg-[var(--db-brand)] text-white shadow-[0_5px_14px_#5556de20] hover:bg-[var(--db-brand-hover)] active:scale-[.985]', secondary:'border border-[var(--db-line)] bg-white text-[var(--db-ink)] hover:bg-[var(--db-canvas)]', ghost:'text-[var(--db-secondary)] hover:bg-[var(--db-soft)]', soft:'bg-[var(--db-soft)] text-[var(--db-brand)] hover:brightness-95' };
      return `<button type="button" data-action="${action}" class="${buttonBase} ${variants[kind]} ${extra}" ${attrs}>${text}</button>`;
    },
    Badge(text, kind='brand') {
      const colors = {brand:'bg-[var(--db-soft)] text-[var(--db-brand)]', green:'bg-[#edf7f2] text-[var(--db-green)]', amber:'bg-[#fcf5e7] text-[var(--db-amber)]', red:'bg-[#fff0f1] text-[var(--db-red)]', neutral:'bg-[var(--db-canvas)] text-[var(--db-secondary)]'};
      return `<span class="inline-flex items-center gap-1.5 rounded-full px-2.5 py-1 text-[11px] leading-5 ${colors[kind]}">${text}</span>`;
    },
    Metric(label, value, change, up=true, last=false) {
      return `<div class="min-w-0 px-4 py-4 ${last?'':'sm:border-e sm:border-[var(--db-line)]'}"><div class="mb-2 flex items-center justify-between gap-2 text-xs text-[var(--db-secondary)]">${label}<span class="text-[10px]">میلیارد ریال</span></div><div class="flex flex-wrap items-end justify-between gap-2"><span class="text-[28px] font-medium leading-10 tabular-nums tracking-tight">${value}</span><span class="flex items-center gap-1 text-[11px] ${up?'text-[var(--db-green)]':'text-[var(--db-secondary)]'}">${icon(up?'trending-up':'trending-down','size-3.5')}${change}</span></div></div>`;
    },
    Table(rows) {
      return `<div class="overflow-x-auto rounded-2xl border border-[var(--db-line)] bg-white"><table class="w-full min-w-[440px] border-collapse text-start"><thead><tr class="bg-[var(--db-canvas)] text-xs text-[var(--db-secondary)]"><th scope="col" class="px-5 py-3 text-start font-normal">عنوان</th><th scope="col" class="px-5 py-3 text-start font-normal">مبلغ · ریال</th><th scope="col" class="px-5 py-3 text-start font-normal">وضعیت</th><th scope="col" class="px-4 py-3"><span class="sr-only">جزئیات</span></th></tr></thead><tbody>${rows.map((r,i)=>`<tr class="border-t border-[var(--db-line)]"><th scope="row" class="px-5 py-4 text-start text-sm font-normal">${r[0]}</th><td class="px-5 py-4 tabular-nums">${r[1]}</td><td class="px-5 py-4">${UI.Badge(r[2],r[3]||'neutral')}</td><td class="px-3 py-2">${UI.Button(icon('arrow-up-left'),`evidence:${i}`,'ghost','px-3','aria-label="مشاهده شواهد '+esc(r[0])+'"')}</td></tr>`).join('')}</tbody></table></div>`;
    },
    RadioGroup(){
      return `<fieldset class="grid grid-cols-2 gap-3"><legend class="sr-only">واحد مبلغ</legend>${[['rial','ریال'],['toman','تومان']].map(([value,label])=>`<label class="relative cursor-interaction"><input type="radio" name="db-unit" value="${value}" ${state.answer===value?'checked':''} class="peer sr-only"/><span class="flex min-h-12 items-center justify-center gap-2 rounded-xl border border-[var(--db-line)] bg-white px-4 py-2 text-sm peer-checked:border-[var(--db-brand)] peer-checked:bg-[var(--db-soft)] peer-checked:text-[var(--db-brand)] peer-focus-visible:outline-2 peer-focus-visible:outline-offset-4 peer-focus-visible:outline-[var(--db-brand)] [&_.db-check]:hidden peer-checked:[&_.db-check]:block peer-checked:[&_.db-circle]:hidden">${icon('circle-check','db-check size-4')}${icon('circle','db-circle size-4')}${label}</span></label>`).join('')}</fieldset>`;
    },
    Dialog(title, body, footer='') {
      const returnAction=root.ownerDocument.activeElement?.closest('[data-action]')?.dataset.action;
      const host=q('#db-dialog-host');
      host.innerHTML=`<dialog aria-labelledby="db-modal-title" class="inset-x-0 bottom-auto top-6 mx-auto my-0 max-h-[calc(100vh-48px)] w-[calc(100%-32px)] max-w-lg overflow-y-auto sm:top-14 rounded-3xl border border-[var(--db-line)] bg-white p-0 font-db text-[var(--db-ink)] shadow-[0_32px_100px_#20243f35] backdrop:bg-[#20243f55] backdrop:backdrop-blur-sm motion-safe:animate-[db-reveal_.24s_ease-out]" dir="rtl"><div class="flex items-start justify-between gap-4 border-b border-[var(--db-line)] p-6"><div><span class="mb-2 block text-xs text-[var(--db-secondary)]">دیدبان مالی · نمونه تعاملی</span><h2 id="db-modal-title" class="font-display text-xl font-medium">${title}</h2></div>${UI.Button(icon('x'),'close-dialog','ghost','shrink-0 px-3','aria-label="بستن پنجره"')}</div><div class="p-6">${body}</div>${footer?`<div class="flex flex-wrap justify-end gap-2 border-t border-[var(--db-line)] bg-[var(--db-canvas)] px-6 py-4">${footer}</div>`:''}</dialog>`;
      const dialog=host.querySelector('dialog');
      dialog.addEventListener('close',()=>{ if(state.flow==='waiting'){render();q('[data-action="question"]')?.focus();}else if(returnAction){Array.from(root.querySelectorAll('[data-action]')).find(el=>el.dataset.action===returnAction)?.focus();} });
      dialog.showModal(); icons();
    },
    State(type) {
      return `<section class="grid min-h-[410px] place-items-center rounded-3xl border border-[var(--db-line)] bg-white px-6 py-12 text-center"><div class="max-w-sm"><span class="mx-auto mb-5 grid size-20 place-items-center rounded-[26px] ${type==='error'?'bg-[#fff0f1] text-[var(--db-red)]':'bg-[var(--db-soft)] text-[var(--db-brand)]'}">${icon(type==='error'?'cloud-off':'folder-up','size-8')}</span><h2 class="font-display text-xl font-medium">${type==='error'?'پردازش در انتظار اتصال':'اولین تصویر مالی را بسازید'}</h2><p class="my-4 text-sm text-[var(--db-secondary)]">${type==='error'?'دریافت پاسخ متوقف شده؛ فایل‌ها و مراحل انجام‌شده حفظ شده‌اند.':'گردش بانک و خروجی حسابداری را اضافه کنید.'}</p>${UI.Button(icon(type==='error'?'rotate-cw':'plus')+(type==='error'?'تلاش دوباره در نمونه':'بارگذاری اسناد'),type==='error'?'retry':'upload','primary')}<p class="mt-5 text-xs text-[var(--db-secondary)]">این حالت، بخشی از پیش‌نمایش طراحی است.</p></div></section>`;
    }
  };
  const nav=[['overview','نمای کلی','layout-dashboard'],['uploads','اسناد و پردازش','folder-up'],['review','بررسی و پیگیری','scan-line'],['cash','گزارش نقدینگی','wallet'],['forecast','پیش‌بینی ۳۰روزه','chart-no-axes-combined'],['receivables','مطالبات','arrow-down-left'],['payables','بدهی‌ها','arrow-up-right'],['moadian','تطبیق مؤدیان','files'],['settlements','دریافت و پرداخت','arrow-left-right'],['reports','گزارش‌ها','file-chart-column']];
  const saved=window.openai?.widgetState;
  const state={page:'overview',flow:'idle',step:0,files:[],answer:'rial',view:'populated',theme:'iris',...saved?.privateContent};
  state.flow='idle'; state.step=0; state.files=[];
  let timer;
  function icons(){ if(globalThis.lucide) lucide.createIcons({root,attrs:{width:17,height:17,'stroke-width':1.65}}); }
  function persist(){window.openai?.setWidgetState?.({modelContent:{palette:state.theme,screen:state.page},privateContent:{page:state.page,view:state.view,theme:state.theme}})?.catch(()=>{});}
  function announce(text){q('#db-live').textContent=text;}
  function reveal(){const content=q('#db-content');if(!window.matchMedia('(prefers-reduced-motion: reduce)').matches) content.animate([{opacity:.35,transform:'translateY(5px)'},{opacity:1,transform:'translateY(0)'}],{duration:280,easing:'cubic-bezier(.2,.7,.2,1)'});}
  function applyPalette(){
    const styles=state.theme==='jade'?{'--db-brand':'#087e75','--db-brand-hover':'#09685f','--db-soft':'#e5f4ee'}:{'--db-brand':'#5556de','--db-brand-hover':'#4345bf','--db-soft':'#eeedff'};
    Object.entries(styles).forEach(([k,v])=>root.style.setProperty(k,v));

  function drawCharts(){
    root.querySelectorAll('[data-db-chart]').forEach(svg=>{

      let d=`M${pts[0][0]} ${pts[0][1]}`;
      for(let i=1;i<pts.length;i++){
        const prev=pts[i-1],current=pts[i],middle=(prev[0]+current[0])/2;
        d+=` C${middle} ${prev[1]} ${middle} ${current[1]} ${current[0]} ${current[1]}`;

      svg.setAttribute('viewBox',`0 0 ${width} ${height}`);
      svg.innerHTML=`<defs><linearGradient id="db-area" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="var(--db-brand)" stop-opacity=".17"/><stop offset="1" stop-color="var(--db-brand)" stop-opacity="0"/></linearGradient></defs><g stroke="var(--db-line)" stroke-width="1"><path d="M${left} 30H${right}M${left} 83H${right}M${left} 136H${right}"/></g><g fill="var(--db-secondary)" font-size="11" font-family="DBYekan" text-anchor="middle"><text x="10" y="34">۳۰</text><text x="10" y="87">۲۰</text><text x="10" y="140">۱۰</text></g><path d="${d} L${right} 153 L${left} 153Z" fill="url(#db-area)"/><path d="${d}" fill="none" stroke="var(--db-brand)" stroke-width="2.5" stroke-linecap="round" ${forecast?'stroke-dasharray="6 5"':''}/>${pts.map(([x,y],i)=>`<circle cx="${x}" cy="${y}" r="13" fill="transparent" data-tooltip="${values[i].toLocaleString('fa-IR')} میلیارد ریال؛ نقطه نمونه ${i+1}"/>`).join('')}<circle cx="${right}" cy="${pts.at(-1)[1]}" r="5" fill="var(--db-brand)" stroke="white" stroke-width="3"/><g fill="var(--db-secondary)" font-size="11" font-family="DBYekan" direction="ltr"><text x="${left}" y="177" text-anchor="start">${forecast?'امروز':'۱ مهر'}</text><text x="${left+(right-left)/3}" y="177" text-anchor="middle">${forecast?'۱۰ روز':'۱۰ مهر'}</text><text x="${left+2*(right-left)/3}" y="177" text-anchor="middle">${forecast?'۲۰ روز':'۲۰ مهر'}</text><text x="${right}" y="177" text-anchor="end">${forecast?'۳۰ روز':'۳۰ مهر'}</text></g>`;
    });
  }

  }
  function showUpload(){
    UI.Dialog('اسناد را اضافه کنید',`<div class="rounded-2xl border border-dashed border-[#c8c6ed] bg-[var(--db-canvas)] p-6 text-center"><span class="mx-auto mb-4 grid size-16 place-items-center rounded-[22px] bg-white text-[var(--db-brand)] shadow-[0_8px_24px_#5556de10]">${icon('folder-up','size-7')}</span><p class="font-medium">فایل‌ها را انتخاب کنید</p><p class="mb-5 mt-1 text-xs text-[var(--db-secondary)]">Excel و CSV · تا ۱۰ فایل</p><input id="db-file-input" type="file" accept=".xlsx,.xls,.csv" multiple hidden/>${UI.Button('انتخاب فایل'+icon('plus'),'choose-files','secondary')}<div id="db-file-names" class="mt-4 grid gap-2 text-xs text-[var(--db-secondary)]"></div><p id="db-file-error" role="alert" class="mt-3 text-xs text-[var(--db-red)]"></p></div><p class="mt-4 text-xs text-[var(--db-secondary)]">در این نمونه، فایل‌ها خوانده یا ارسال نمی‌شوند.</p>`,UI.Button('استفاده از دو فایل نمونه','sample-files','soft')+UI.Button('نمایش روند نمونه'+icon('arrow-left'),'start-upload','primary'));
    if(state.files.length) q('#db-file-names').textContent=state.files.join('، ');
    q('#db-file-input').addEventListener('change',e=>{
      const files=Array.from(e.target.files||[]);
      const error=files.length>10?'حداکثر ۱۰ فایل انتخاب کنید.':files.some(f=>!(/\.(xlsx|xls|csv)$/i.test(f.name)))?'فقط Excel و CSV پذیرفته می‌شود.':'';
      q('#db-file-error').textContent=error;
      state.files=error?[]:files.map(f=>f.name);
      q('#db-file-names').textContent=state.files.join('، ');
    });
  }
  function showQuestion(){
    UI.Dialog('واحد این فایل چیست؟',`<div class="mb-5 flex items-start gap-3 rounded-2xl bg-[#fffbf1] p-4 text-xs text-[var(--db-amber)]">${icon('pause','size-5 shrink-0')}<span>کل بسته تا پاسخ شما متوقف است.</span></div><div class="mb-5 rounded-2xl border border-[var(--db-line)] p-4"><div class="mb-2 flex items-center gap-2 text-xs text-[var(--db-secondary)]">${icon('file-spreadsheet')}ریز اسناد حسابداری.xlsx · شیت ۱</div><div class="flex items-center justify-between gap-2 text-sm"><span>مبلغ بدهکار · ردیف ۱۸</span><span class="tabular-nums">۸۵٬۰۰۰٬۰۰۰</span></div><p class="mt-2 text-xs text-[var(--db-secondary)]">واحد در سرستون فایل مشخص نیست.</p></div>${UI.RadioGroup()}`,UI.Button('بعداً پاسخ می‌دهم','close-dialog','ghost')+UI.Button('ثبت پاسخ و ادامه'+icon('arrow-left'),'answer','primary'));
  }
  function showEvidence(){
    UI.Dialog('شواهدِ یک پرداخت',`<div class="mb-5 flex flex-wrap items-center justify-between gap-2">${UI.Badge('نیازمند بررسی','amber')}<span class="text-xs text-[var(--db-secondary)]">داده‌های نمونه</span></div><div class="grid gap-3">${[['گردش بانک','شماره پیگیری ۱۲۴۰۸','۸۵٬۰۰۰٬۰۰۰ ریال','landmark'],['دفتر حسابداری','سند ۴۱۸ · ردیف‌های ۲ و ۳','دو ثبت با مرجع مشترک','file-spreadsheet']].map(([label,detail,value,ic])=>`<section class="rounded-2xl border border-[var(--db-line)] p-4"><div class="mb-3 flex items-center gap-2 text-xs text-[var(--db-secondary)]">${icon(ic)}${label}</div><div class="mb-2 flex flex-wrap justify-between gap-2"><span class="text-sm">${value}</span><span class="text-xs text-[var(--db-secondary)]">۱۸ مهر</span></div><div class="text-xs text-[var(--db-secondary)]">${detail}</div></section>`).join('')}</div><p class="mt-5 text-xs text-[var(--db-secondary)]">اشتراک مرجع، به‌تنهایی اثبات ثبت تکراری نیست.</p>`,UI.Button('بازگشت','close-dialog','secondary'));
  }
  function startDemo(){
    clearTimeout(timer);q('dialog')?.close();state.files=state.files.length?state.files:['گردش بانک مهر.xlsx','ریز اسناد حسابداری.xlsx'];state.view='populated';state.page='uploads';state.flow='running';state.step=0;render();reveal();advance();
  }
  function advance(){
    timer=setTimeout(()=>{
      if(state.flow!=='running')return;
      if(state.step===1){state.flow='waiting';state.step=2;render();announce('پردازش نمونه متوقف است و به پاسخ شما نیاز دارد.');showQuestion();return;}
      if(state.step>=4){state.flow='complete';render();announce('روند نمایشی کامل شد.');return;}
      state.step++;render();advance();
    },1050);
  }
  root.addEventListener('change',e=>{if(e.target.name==='db-unit')state.answer=e.target.value;});
  root.addEventListener('click',e=>{
    const target=e.target.closest('[data-action]');if(!target||target.disabled)return;
    const action=target.dataset.action;
    if(action.startsWith('nav:')){state.page=action.split(':')[1];state.view='populated';render();reveal();persist();return;}
    if(action.startsWith('evidence:')||action==='chart-detail'){showEvidence();return;}
    if(action==='upload')showUpload();
    if(action==='close-dialog')q('dialog')?.close();
    if(action==='choose-files')q('#db-file-input').click();
    if(action==='sample-files'){state.files=['گردش بانک مهر.xlsx','ریز اسناد حسابداری.xlsx'];q('#db-file-names').textContent=state.files.join('، ');q('#db-file-error').textContent='';}
    if(action==='start-upload'){
      if(!state.files.length){q('#db-file-error').textContent='فایل انتخاب کنید یا از فایل‌های نمونه استفاده کنید.';q('[data-action="choose-files"]').focus();return;}startDemo();
    }
    if(action==='demo'||action==='retry')startDemo();
    if(action==='question')showQuestion();
    if(action==='answer'){q('dialog').close();state.flow='running';state.step=2;render();announce('پاسخ نمونه ثبت شد؛ نمایش پردازش ادامه دارد.');advance();}
    if(action==='notifications'){UI.Dialog('اعلان‌ها',`<div class="flex gap-3 rounded-2xl bg-[var(--db-soft)] p-4"><span class="text-[var(--db-brand)]">${icon(state.flow==='waiting'?'circle-help':'circle-check')}</span><div><p class="font-medium">${state.flow==='waiting'?'واحد فایل نیازمند پاسخ است':'گزارش نمونه مهر آماده است'}</p><p class="mt-1 text-xs text-[var(--db-secondary)]">${state.flow==='waiting'?'کل بسته تا دریافت پاسخ متوقف می‌ماند.':'۲ منبع و ۱٬۲۴۸ ردیف نمایشی'}</p></div></div>`,UI.Button(state.flow==='waiting'?'پاسخ به سؤال':'مشاهده گزارش','notification-go','primary'));}
    if(action==='notification-go'){q('dialog').close();if(state.flow==='waiting')showQuestion();else{state.page='reports';render();reveal();}}
    if(action==='report-preview'){UI.Dialog('گزارش مالی مهر',`<div class="mb-5">${UI.Badge('تولیدشده سامانه')}</div><div class="grid gap-4"><div class="flex justify-between border-b border-[var(--db-line)] pb-3"><span>درآمد</span><span>۴۲٫۵ میلیارد ریال</span></div><div class="flex justify-between border-b border-[var(--db-line)] pb-3"><span>هزینه</span><span>۳۱٫۸ میلیارد ریال</span></div><div class="flex justify-between pb-3 font-medium"><span>سود خالص</span><span>۱۰٫۷ میلیارد ریال</span></div></div><p class="text-xs text-[var(--db-secondary)]">پیش‌نمایش بصری است؛ گزارش مالی واقعی یا فایل قابل دانلود تولید نمی‌شود.</p>`,UI.Button('بستن','close-dialog','secondary'));}
  });
  render();
  new ResizeObserver(()=>drawCharts()).observe(root);
  if(globalThis.Tweak){
    const options={palette:state.theme,scene:state.view};
    const tweak=new Tweak({container:root,onChange:()=>{state.theme=options.palette;state.view=options.scene;clearTimeout(timer);state.flow='idle';q('dialog')?.close();render();reveal();persist();}});
    tweak.addSelect(options,'palette',{label:'رنگ امضا',options:[{label:'زنبق؛ نیلی زنده',value:'iris'},{label:'یشم؛ سبز عمیق',value:'jade'}]});
    tweak.addSelect(options,'scene',{label:'حالت صفحه',options:[{label:'داده‌های آماده',value:'populated'},{label:'شرکت تازه',value:'empty'},{label:'خطای پردازش',value:'error'}]});
  }
})();
</script>
