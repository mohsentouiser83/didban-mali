name: Quality

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint:web
      - run: npm run typecheck:web
      - run: npm run test:web
      - run: npm run build:web

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - run: pip install -e 'apps/api[dev]'
      - run: ruff check --config apps/api/pyproject.toml apps/api
      - run: mypy --config-file apps/api/pyproject.toml apps/api/app
      - run: pytest -c apps/api/pyproject.toml apps/api/tests

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet

  secure-import-and-tenant-isolation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - run: pip install -e 'apps/api[dev]'
      - run: docker compose up --build -d
      - run: curl --retry 30 --retry-all-errors --retry-delay 2 --fail http://localhost:8000/api/v1/health/ready
      - run: RUN_INTEGRATION_TESTS=1 pytest -c apps/api/pyproject.toml apps/api/tests/test_tenant_isolation.py
      - if: always()
        run: docker compose down --volumes
