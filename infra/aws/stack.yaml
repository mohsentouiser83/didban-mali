AWSTemplateFormatVersion: '2010-09-09'
Description: Didban web, API, worker and scanner on Fargate with private PostgreSQL and shared document storage.
Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
  PublicSubnets:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Exactly two existing ALB subnets in different availability zones.
  AlbSubnetCidrs:
    Type: CommaDelimitedList
    Description: IPv4 CIDRs of the public ALB subnets trusted for forwarded headers.
  PrivateSubnetA:
    Type: AWS::EC2::Subnet::Id
  PrivateSubnetB:
    Type: AWS::EC2::Subnet::Id
  Domain:
    Type: String
    AllowedPattern: '[a-z0-9][a-z0-9.-]+[a-z0-9]'
  CertificateArn:
    Type: String
  IngressCidr:
    Type: String
    Description: IPv4 CIDR permitted to access the installation over HTTPS.
  ApiImage:
    Type: String
    AllowedPattern: '.+@sha256:[0-9a-f]{64}'
    Description: ECR digest URI built with apps/api/Dockerfile --target aws.
  WebImage:
    Type: String
    AllowedPattern: '.+@sha256:[0-9a-f]{64}'
  ScannerImage:
    Type: String
    AllowedPattern: '.+@sha256:[0-9a-f]{64}'
    Description: Digest URI of the ClamAV Debian image.
  DatabaseClass:
    Type: String
    Default: db.t4g.medium
  DatabaseMultiAz:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'true'
  StartServices:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'false'
    Description: Set true only after the database bootstrap task succeeds.
  WebAndApiReplicas:
    Type: Number
    Default: 2
    MinValue: 1
  EnableApiExec:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'false'
Conditions:
  Start: !Equals [!Ref StartServices, 'true']
  MultiAz: !Equals [!Ref DatabaseMultiAz, 'true']
  ApiExec: !Equals [!Ref EnableApiExec, 'true']
Resources:
  LoadBalancerGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: HTTPS ingress for Didban
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - {IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: !Ref IngressCidr}
  WebGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Web traffic from the load balancer
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - {IpProtocol: tcp, FromPort: 3010, ToPort: 3010, SourceSecurityGroupId: !Ref LoadBalancerGroup}
  ApiGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: API traffic from the load balancer
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - {IpProtocol: tcp, FromPort: 8000, ToPort: 8000, SourceSecurityGroupId: !Ref LoadBalancerGroup}
  BackgroundGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Worker and database provisioning tasks
      VpcId: !Ref VpcId
  DatabaseGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: PostgreSQL from API and background tasks
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - {IpProtocol: tcp, FromPort: 5432, ToPort: 5432, SourceSecurityGroupId: !Ref ApiGroup}
        - {IpProtocol: tcp, FromPort: 5432, ToPort: 5432, SourceSecurityGroupId: !Ref BackgroundGroup}
  StorageGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: NFS from API and worker
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - {IpProtocol: tcp, FromPort: 2049, ToPort: 2049, SourceSecurityGroupId: !Ref ApiGroup}
        - {IpProtocol: tcp, FromPort: 2049, ToPort: 2049, SourceSecurityGroupId: !Ref BackgroundGroup}
  ScannerGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ClamAV from API and worker
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - {IpProtocol: tcp, FromPort: 3310, ToPort: 3310, SourceSecurityGroupId: !Ref ApiGroup}
        - {IpProtocol: tcp, FromPort: 3310, ToPort: 3310, SourceSecurityGroupId: !Ref BackgroundGroup}

  DatabaseSubnets:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Private Didban database subnets
      SubnetIds: [!Ref PrivateSubnetA, !Ref PrivateSubnetB]
  Database:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      Engine: postgres
      EngineVersion: '17'
      DBInstanceClass: !Ref DatabaseClass
      DBName: didban_fresh
      MasterUsername: didban_admin
      ManageMasterUserPassword: true
      PubliclyAccessible: false
      StorageEncrypted: true
      StorageType: gp3
      AllocatedStorage: '30'
      MaxAllocatedStorage: 150
      BackupRetentionPeriod: 14
      CopyTagsToSnapshot: true
      DeletionProtection: true
      MultiAZ: !If [MultiAz, true, false]
      DBSubnetGroupName: !Ref DatabaseSubnets
      VPCSecurityGroups: [!Ref DatabaseGroup]
  AppPassword:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: Password of the restricted didban_app role
      GenerateSecretString:
        PasswordLength: 48

  Documents:
    Type: AWS::EFS::FileSystem
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Encrypted: true
      BackupPolicy: {Status: ENABLED}
      FileSystemPolicy:
        Version: '2012-10-17'
        Statement:
          - Effect: Deny
            Principal: '*'
            Action: ['elasticfilesystem:ClientMount', 'elasticfilesystem:ClientWrite', 'elasticfilesystem:ClientRootAccess']
            Condition:
              Bool: {'aws:SecureTransport': 'false'}
  DocumentAccess:
    Type: AWS::EFS::AccessPoint
    Properties:
      FileSystemId: !Ref Documents
      PosixUser: {Uid: '10001', Gid: '10001'}
      RootDirectory:
        Path: /didban
        CreationInfo: {OwnerUid: '10001', OwnerGid: '10001', Permissions: '0700'}
  DocumentMountA:
    Type: AWS::EFS::MountTarget
    Properties:
      FileSystemId: !Ref Documents
      SubnetId: !Ref PrivateSubnetA
      SecurityGroups: [!Ref StorageGroup]
  DocumentMountB:
    Type: AWS::EFS::MountTarget
    Properties:
      FileSystemId: !Ref Documents
      SubnetId: !Ref PrivateSubnetB
      SecurityGroups: [!Ref StorageGroup]

  Logs:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    Properties:
      RetentionInDays: 30
  Cluster:
    Type: AWS::ECS::Cluster
  ScannerNamespace:
    Type: AWS::ServiceDiscovery::PrivateDnsNamespace
    Properties:
      Name: !Sub '${AWS::StackName}.internal'
      Vpc: !Ref VpcId
  ScannerDiscovery:
    Type: AWS::ServiceDiscovery::Service
    Properties:
      Name: scanner
      DnsConfig:
        NamespaceId: !Ref ScannerNamespace
        RoutingPolicy: MULTIVALUE
        DnsRecords:
          - {Type: A, TTL: 10}
      HealthCheckCustomConfig: {FailureThreshold: 1}

  RuntimeExecution:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - {Effect: Allow, Principal: {Service: ecs-tasks.amazonaws.com}, Action: 'sts:AssumeRole'}
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy'
      Policies:
        - PolicyName: ReadApplicationPassword
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - {Effect: Allow, Action: 'secretsmanager:GetSecretValue', Resource: !Ref AppPassword}
  BootstrapExecution:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - {Effect: Allow, Principal: {Service: ecs-tasks.amazonaws.com}, Action: 'sts:AssumeRole'}
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy'
      Policies:
        - PolicyName: ReadDatabaseBootstrapPasswords
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: 'secretsmanager:GetSecretValue'
                Resource: [!Ref AppPassword, !GetAtt Database.MasterUserSecret.SecretArn]
  ApiTaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - {Effect: Allow, Principal: {Service: ecs-tasks.amazonaws.com}, Action: 'sts:AssumeRole'}
  WorkerTaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - {Effect: Allow, Principal: {Service: ecs-tasks.amazonaws.com}, Action: 'sts:AssumeRole'}
  DocumentMountPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: MountDidbanDocuments
      Roles: [!Ref ApiTaskRole, !Ref WorkerTaskRole]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: ['elasticfilesystem:ClientMount', 'elasticfilesystem:ClientWrite']
            Resource: !GetAtt Documents.Arn
            Condition:
              StringEquals:
                'elasticfilesystem:AccessPointArn': !GetAtt DocumentAccess.Arn
  ApiExecPolicy:
    Type: AWS::IAM::Policy
    Condition: ApiExec
    Properties:
      PolicyName: InteractiveInstallationAdministration
      Roles: [!Ref ApiTaskRole]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - 'ssmmessages:CreateControlChannel'
              - 'ssmmessages:CreateDataChannel'
              - 'ssmmessages:OpenControlChannel'
              - 'ssmmessages:OpenDataChannel'
            Resource: '*'

  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Scheme: internet-facing
      SecurityGroups: [!Ref LoadBalancerGroup]
      Subnets: !Ref PublicSubnets
      LoadBalancerAttributes:
        - {Key: routing.http.drop_invalid_header_fields.enabled, Value: 'true'}
        - {Key: idle_timeout.timeout_seconds, Value: '120'}
  WebTarget:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref VpcId
      Protocol: HTTP
      Port: 3010
      TargetType: ip
      HealthCheckPath: /
  ApiTarget:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref VpcId
      Protocol: HTTP
      Port: 8000
      TargetType: ip
      HealthCheckPath: /api/v1/health
  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 443
      Protocol: HTTPS
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      Certificates:
        - {CertificateArn: !Ref CertificateArn}
      DefaultActions:
        - {Type: forward, TargetGroupArn: !Ref WebTarget}
  ReadinessRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref HttpsListener
      Priority: 5
      Conditions:
        - Field: path-pattern
          PathPatternConfig: {Values: ['/api/v1/health/readiness', '/api/v1/health/readiness/']}
      Actions:
        - {Type: fixed-response, FixedResponseConfig: {StatusCode: '404'}}
  ApiRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref HttpsListener
      Priority: 10
      Conditions:
        - Field: path-pattern
          PathPatternConfig: {Values: ['/api/*']}
      Actions:
        - {Type: forward, TargetGroupArn: !Ref ApiTarget}

  BootstrapTask:
    Type: AWS::ECS::TaskDefinition
    Properties:
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: '256'
      Memory: '512'
      ExecutionRoleArn: !GetAtt BootstrapExecution.Arn
      ContainerDefinitions:
        - Name: bootstrap
          Image: !Ref ApiImage
          EntryPoint: [python, /app/scripts/aws_runtime.py]
          Command: [bootstrap-db]
          Environment:
            - {Name: DIDBAN_DB_HOST, Value: !GetAtt Database.Endpoint.Address}
          Secrets:
            - {Name: DIDBAN_DB_APP_PASSWORD, ValueFrom: !Ref AppPassword}
            - Name: DIDBAN_DB_ADMIN_PASSWORD
              ValueFrom: !Sub '${Database.MasterUserSecret.SecretArn}:password::'
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref Logs
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: bootstrap
  WebTask:
    Type: AWS::ECS::TaskDefinition
    Properties:
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: '512'
      Memory: '1024'
      ExecutionRoleArn: !GetAtt RuntimeExecution.Arn
      ContainerDefinitions:
        - Name: web
          Image: !Ref WebImage
          PortMappings:
            - {ContainerPort: 3010}
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref Logs
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: web
  ApiTask:
    Type: AWS::ECS::TaskDefinition
    Properties:
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: '1024'
      Memory: '2048'
      ExecutionRoleArn: !GetAtt RuntimeExecution.Arn
      TaskRoleArn: !GetAtt ApiTaskRole.Arn
      Volumes:
        - Name: documents
          EFSVolumeConfiguration:
            FilesystemId: !Ref Documents
            TransitEncryption: ENABLED
            AuthorizationConfig: {AccessPointId: !Ref DocumentAccess, IAM: ENABLED}
      ContainerDefinitions:
        - Name: api
          Image: !Ref ApiImage
          EntryPoint: [python, /app/scripts/aws_runtime.py]
          Command: [uvicorn, 'didban.api:app', --host, '0.0.0.0', --port, '8000']
          LinuxParameters: {InitProcessEnabled: true}
          PortMappings:
            - {ContainerPort: 8000}
          MountPoints:
            - {SourceVolume: documents, ContainerPath: /app/var/private}
          Environment:
            - {Name: FORWARDED_ALLOW_IPS, Value: !Join [',', !Ref AlbSubnetCidrs]}
            - {Name: DIDBAN_DB_HOST, Value: !GetAtt Database.Endpoint.Address}
            - {Name: DIDBAN_PRODUCTION, Value: 'true'}
            - {Name: DIDBAN_EMBEDDED_WORKER, Value: 'false'}
            - {Name: DIDBAN_WEB_ORIGIN, Value: !Sub 'https://${Domain}'}
            - {Name: DIDBAN_SCANNER_HOST, Value: !Sub 'scanner.${AWS::StackName}.internal'}
          Secrets:
            - {Name: DIDBAN_DB_APP_PASSWORD, ValueFrom: !Ref AppPassword}
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref Logs
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: api
  WorkerTask:
    Type: AWS::ECS::TaskDefinition
    Properties:
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: '1024'
      Memory: '2048'
      ExecutionRoleArn: !GetAtt RuntimeExecution.Arn
      TaskRoleArn: !GetAtt WorkerTaskRole.Arn
      Volumes:
        - Name: documents
          EFSVolumeConfiguration:
            FilesystemId: !Ref Documents
            TransitEncryption: ENABLED
            AuthorizationConfig: {AccessPointId: !Ref DocumentAccess, IAM: ENABLED}
      ContainerDefinitions:
        - Name: worker
          Image: !Ref ApiImage
          EntryPoint: [python, /app/scripts/aws_runtime.py]
          Command: [python, -m, didban.worker]
          StopTimeout: 120
          MountPoints:
            - {SourceVolume: documents, ContainerPath: /app/var/private}
          Environment:
            - {Name: DIDBAN_DB_HOST, Value: !GetAtt Database.Endpoint.Address}
            - {Name: DIDBAN_PRODUCTION, Value: 'true'}
            - {Name: DIDBAN_EMBEDDED_WORKER, Value: 'false'}
            - {Name: DIDBAN_WEB_ORIGIN, Value: !Sub 'https://${Domain}'}
            - {Name: DIDBAN_SCANNER_HOST, Value: !Sub 'scanner.${AWS::StackName}.internal'}
          Secrets:
            - {Name: DIDBAN_DB_APP_PASSWORD, ValueFrom: !Ref AppPassword}
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref Logs
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: worker
  ScannerTask:
    Type: AWS::ECS::TaskDefinition
    Properties:
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: '1024'
      Memory: '4096'
      ExecutionRoleArn: !GetAtt RuntimeExecution.Arn
      ContainerDefinitions:
        - Name: scanner
          Image: !Ref ScannerImage
          PortMappings:
            - {ContainerPort: 3310}
          HealthCheck:
            Command: [CMD, clamdcheck.sh]
            Interval: 20
            Timeout: 10
            Retries: 10
            StartPeriod: 300
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref Logs
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: scanner

  WebService:
    Type: AWS::ECS::Service
    DependsOn: HttpsListener
    Properties:
      Cluster: !Ref Cluster
      LaunchType: FARGATE
      PlatformVersion: '1.4.0'
      TaskDefinition: !Ref WebTask
      DesiredCount: !If [Start, !Ref WebAndApiReplicas, 0]
      DeploymentConfiguration:
        DeploymentCircuitBreaker: {Enable: true, Rollback: true}
      HealthCheckGracePeriodSeconds: 90
      LoadBalancers:
        - {TargetGroupArn: !Ref WebTarget, ContainerName: web, ContainerPort: 3010}
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets: [!Ref PrivateSubnetA, !Ref PrivateSubnetB]
          SecurityGroups: [!Ref WebGroup]
  ApiService:
    Type: AWS::ECS::Service
    DependsOn: [ApiRule, DocumentMountA, DocumentMountB, DocumentMountPolicy]
    Properties:
      Cluster: !Ref Cluster
      LaunchType: FARGATE
      PlatformVersion: '1.4.0'
      TaskDefinition: !Ref ApiTask
      DesiredCount: !If [Start, !Ref WebAndApiReplicas, 0]
      EnableExecuteCommand: !If [ApiExec, true, false]
      DeploymentConfiguration:
        DeploymentCircuitBreaker: {Enable: true, Rollback: true}
      HealthCheckGracePeriodSeconds: 120
      LoadBalancers:
        - {TargetGroupArn: !Ref ApiTarget, ContainerName: api, ContainerPort: 8000}
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets: [!Ref PrivateSubnetA, !Ref PrivateSubnetB]
          SecurityGroups: [!Ref ApiGroup]
  WorkerService:
    Type: AWS::ECS::Service
    DependsOn: [DocumentMountA, DocumentMountB, DocumentMountPolicy]
    Properties:
      Cluster: !Ref Cluster
      LaunchType: FARGATE
      PlatformVersion: '1.4.0'
      TaskDefinition: !Ref WorkerTask
      DesiredCount: !If [Start, 1, 0]
      DeploymentConfiguration:
        MinimumHealthyPercent: 0
        MaximumPercent: 100
        DeploymentCircuitBreaker: {Enable: true, Rollback: true}
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets: [!Ref PrivateSubnetA, !Ref PrivateSubnetB]
          SecurityGroups: [!Ref BackgroundGroup]
  ScannerService:
    Type: AWS::ECS::Service
    Properties:
      Cluster: !Ref Cluster
      LaunchType: FARGATE
      PlatformVersion: '1.4.0'
      TaskDefinition: !Ref ScannerTask
      DesiredCount: !If [Start, 1, 0]
      DeploymentConfiguration:
        DeploymentCircuitBreaker: {Enable: true, Rollback: true}
      ServiceRegistries:
        - {RegistryArn: !GetAtt ScannerDiscovery.Arn}
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets: [!Ref PrivateSubnetA, !Ref PrivateSubnetB]
          SecurityGroups: [!Ref ScannerGroup]
Outputs:
  WebOrigin:
    Value: !Sub 'https://${Domain}'
  LoadBalancerDns:
    Value: !GetAtt LoadBalancer.DNSName
  LoadBalancerZone:
    Value: !GetAtt LoadBalancer.CanonicalHostedZoneID
  Cluster:
    Value: !Ref Cluster
  ApiService:
    Value: !GetAtt ApiService.Name
  BootstrapTask:
    Value: !Ref BootstrapTask
  BootstrapSecurityGroup:
    Value: !Ref BackgroundGroup
  BootstrapSubnets:
    Value: !Join [',', [!Ref PrivateSubnetA, !Ref PrivateSubnetB]]
  DatabaseIdentifier:
    Value: !Ref Database
  DocumentsFileSystem:
    Value: !Ref Documents
  LogGroup:
    Value: !Ref Logs
