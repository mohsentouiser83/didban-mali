name: didban-fresh
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: didban_fresh
      POSTGRES_USER: didban_migration_admin
      POSTGRES_PASSWORD: ${DIDBAN_POSTGRES_ADMIN_PASSWORD:?Set DIDBAN_POSTGRES_ADMIN_PASSWORD}
      DIDBAN_APP_DB_PASSWORD: ${DIDBAN_APP_DB_PASSWORD:?Set DIDBAN_APP_DB_PASSWORD}
    volumes:
      - fresh_postgres:/var/lib/postgresql/data
      - ./infra/postgres/001-app-role.sh:/docker-entrypoint-initdb.d/001-app-role.sh:ro
    ports:
      - 127.0.0.1:55434:5432
    healthcheck:
      test: [CMD-SHELL, pg_isready -U didban_migration_admin -d didban_fresh]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  scanner:
    image: clamav/clamav-debian:1.5.4
    volumes:
      - fresh_clamav:/var/lib/clamav
    healthcheck:
      test: [CMD, clamdcheck.sh]
      interval: 20s
      timeout: 10s
      retries: 20
      start_period: 120s
    restart: unless-stopped
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment: &api_environment
      DIDBAN_DATABASE_URL: postgresql+psycopg://didban_app:${DIDBAN_APP_DB_PASSWORD:?Set DIDBAN_APP_DB_PASSWORD}@postgres:5432/didban_fresh
      DIDBAN_PRODUCTION: ${DIDBAN_PRODUCTION:-true}
      DIDBAN_EMBEDDED_WORKER: "false"
      DIDBAN_STORAGE: /app/var/private
      DIDBAN_MOADIAN_PROFILES_FILE: ${DIDBAN_MOADIAN_PROFILES_FILE:-}
      DIDBAN_FONTS: /app/apps/web/public/fonts
      DIDBAN_WEB_ORIGIN: ${DIDBAN_WEB_ORIGIN:?Set DIDBAN_WEB_ORIGIN}
      DIDBAN_SCANNER_HOST: scanner
      DIDBAN_SCANNER_PORT: "3310"
      DIDBAN_MODEL_BUDGET_UNLIMITED: ${DIDBAN_MODEL_BUDGET_UNLIMITED:-false}
      DIDBAN_MODEL_PROVIDER: ${DIDBAN_MODEL_PROVIDER:-AvalAI}
      DIDBAN_MODEL_ENABLED: ${DIDBAN_MODEL_ENABLED:-false}
      DIDBAN_OPENAI_API_KEY: ${DIDBAN_OPENAI_API_KEY:-}
      DIDBAN_BOTS_ENABLED: ${DIDBAN_BOTS_ENABLED:-false}
      DIDBAN_TELEGRAM_BOT_TOKEN: ${DIDBAN_TELEGRAM_BOT_TOKEN:-}
      DIDBAN_TELEGRAM_WEBHOOK_SECRET: ${DIDBAN_TELEGRAM_WEBHOOK_SECRET:-}
      DIDBAN_TELEGRAM_BOT_USERNAME: ${DIDBAN_TELEGRAM_BOT_USERNAME:-}
      DIDBAN_BALE_BOT_TOKEN: ${DIDBAN_BALE_BOT_TOKEN:-}
      DIDBAN_BALE_WEBHOOK_SECRET: ${DIDBAN_BALE_WEBHOOK_SECRET:-}
      DIDBAN_BALE_BOT_USERNAME: ${DIDBAN_BALE_BOT_USERNAME:-}
      DIDBAN_MEDIA_EXTRACTION_ENABLED: ${DIDBAN_MEDIA_EXTRACTION_ENABLED:-false}
      DIDBAN_MEDIA_MAX_BYTES: ${DIDBAN_MEDIA_MAX_BYTES:-20971520}
      DIDBAN_MEDIA_MAX_PAGES: ${DIDBAN_MEDIA_MAX_PAGES:-4}
      DIDBAN_MEDIA_MAX_PIXELS: ${DIDBAN_MEDIA_MAX_PIXELS:-16000000}
      DIDBAN_VOICE_ENABLED: ${DIDBAN_VOICE_ENABLED:-false}
      DIDBAN_VOICE_MODEL: ${DIDBAN_VOICE_MODEL:-}
    volumes:
      - fresh_private:/app/var/private
    ports:
      - 127.0.0.1:8000:8000
    depends_on:
      postgres:
        condition: service_healthy
      scanner:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: [python, -m, didban.worker]
    environment: *api_environment
    volumes:
      - fresh_private:/app/var/private
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      DIDBAN_API_URL: http://api:8000
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - 127.0.0.1:${DIDBAN_WEB_PORT:-3000}:3010
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3010/api/v1/health', {signal: AbortSignal.timeout(3000)}).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
volumes:
  fresh_postgres:
  fresh_private:
  fresh_clamav:
